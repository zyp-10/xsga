<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#070b1a">
<title>把愿望交给星空</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei", "PingFang SC",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b1a}body{min-height:100vh;min-height:100svh;overflow:hidden;color:#f4f1f5}canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 100%,#28385b88,transparent 54%),radial-gradient(ellipse at 80% 16%,#291e4933,transparent 45%),linear-gradient(180deg,#080b1980,transparent 35%,#070b1ad9);z-index:1}.page{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;text-align:center;padding:clamp(28px,5vh,54px) 22px max(30px,env(safe-area-inset-bottom));pointer-events:none}.eyebrow{font:10px/1.2 Georgia,serif;letter-spacing:.4em;color:#b7c5e4;margin:0 0 24px}.spark{color:#e7c6a0;margin:0 8px;letter-spacing:0}.title{font-family:Georgia,"Songti SC",SimSun,serif;font-weight:400;letter-spacing:.19em;font-size:clamp(28px,5vw,46px);margin:0;color:#faf8ff;text-shadow:0 0 30px #99aee577}.subtitle{font-size:12px;letter-spacing:.24em;color:#aab6d1;margin:15px 0 0;line-height:2}.middle{position:relative;flex:1;display:flex;justify-content:center;align-items:center;width:100%;min-height:100px}.wish-display{font-family:Georgia,"Songti SC",SimSun,serif;font-size:clamp(19px,3vw,28px);letter-spacing:.15em;line-height:1.8;max-width:680px;overflow-wrap:anywhere;text-shadow:0 0 12px #d8dfff,0 0 36px #c4baff;opacity:0;transform:translateY(15px);transition:opacity 1.2s,transform 1.2s}.wish-display.show{opacity:1;transform:translateY(0)}.wish-display.gather{animation:gather-wish .85s ease-in forwards;transition:none}@keyframes gather-wish{0%{opacity:1;transform:scale(1);filter:blur(0)}100%{opacity:0;transform:scale(.04);filter:blur(5px)}}.bottom{width:min(100%,480px);pointer-events:auto}.hint{font-family:Georgia,"Songti SC",SimSun,serif;color:#cad2e5;font-size:14px;letter-spacing:.13em;margin:0 0 18px}.form{display:flex;align-items:center;gap:8px;padding:6px;border:1px solid #a6b6d147;border-radius:999px;background:#10182cc9;box-shadow:0 10px 45px #0004,0 0 30px #9295d012;backdrop-filter:blur(14px)}input{flex:1;width:0;min-width:0;border:0;outline:0;background:transparent;padding:12px 15px;color:#fff;font-size:14px}input::placeholder{color:#8993aa}button{border:0;border-radius:99px;padding:13px 22px;background:#e8e4f2;color:#22253c;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer;transition:transform .2s,background .2s}button:hover{transform:scale(1.03);background:#fff}button:focus-visible,input:focus-visible{outline:2px solid #b8caff;outline-offset:3px}.notice{height:24px;color:#d6c7e9;font-size:12px;letter-spacing:.08em;margin:12px 0 0}.foot{font:10px Georgia,serif;letter-spacing:.25em;color:#8e9bb5;margin:17px 0 0}@media(max-height:520px){.page{padding-top:20px}.eyebrow{margin-bottom:10px}.subtitle{margin-top:5px}.foot{margin-top:3px}.hint{margin-bottom:8px}}@media(prefers-reduced-motion:reduce){.wish-display,button{transition:none}.wish-display.gather{animation:none;opacity:0}}
</style>
</head>
<body><canvas id="sky" aria-hidden="true"></canvas><div class="glow"></div><main class="page"><header><p class="eyebrow"><span class="spark">✦</span> A LITTLE WISH <span class="spark">✦</span></p><h1 class="title">把愿望交给星空</h1><p class="subtitle">在流星划过的瞬间，偷偷许个愿</p></header><div class="middle"><div id="wish-display" class="wish-display" aria-live="polite"></div></div><section class="bottom" aria-label="许愿"><p class="hint">今晚，有一颗流星为你而来</p><form class="form" id="wish-form"><input id="wish" maxlength="80" autocomplete="off" aria-label="输入你的愿望" placeholder="写下你的愿望，最多 40 个字"><button type="submit">放飞愿望 ✦</button></form><p class="notice" id="notice" role="status"></p><p class="foot">MAY YOUR WISH FIND ITS WAY</p></section></main>
<script src="wish.js"></script><script>
(()=>{const canvas=document.querySelector('#sky'),ctx=canvas.getContext('2d'),display=document.querySelector('#wish-display'),notice=document.querySelector('#notice'),input=document.querySelector('#wish');let w=0,h=0,dpr=1,stars=[],meteors=[],last=0,next=0,hideTimer,showTimer,flightTimer;const colors=['184, 209, 255','202, 179, 255','255, 208, 168','255, 180, 210','172, 233, 227'];const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){w=innerWidth;h=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(160,Math.floor(w*h/5500))},()=>({x:Math.random()*w,y:Math.random()*h,r:Math.random()*1.15+.2,a:Math.random()*.65+.15,p:Math.random()*6}));}window.addEventListener('resize',resize);resize();
function meteor(force=false,origin=null){const angle=2.32+Math.random()*.12;meteors.push({x:origin?origin.x:force?w*.72:Math.random()*w*1.25,y:origin?origin.y:force?h*.16:Math.random()*h*.42-40,v:force?7:3+Math.random()*3,dx:Math.cos(angle),dy:Math.sin(angle),length:force?170:80+Math.random()*110,life:0,max:force?100:100+Math.random()*90,color:colors[Math.floor(Math.random()*colors.length)]});}
function draw(time){const dt=Math.min((time-last)/16.67||1,2);last=time;ctx.clearRect(0,0,w,h);for(const s of stars){let a=reduce?s.a:s.a*(.7+.3*Math.sin(time*.001+s.p));ctx.beginPath();ctx.fillStyle=`rgba(220,230,255,${a})`;ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}if(!reduce&&time>next){meteor();next=time+900+Math.random()*1500;}for(let i=meteors.length-1;i>=0;i--){let m=meteors[i];m.x+=m.dx*m.v*dt;m.y+=m.dy*m.v*dt;m.life+=dt;let fade=Math.min(1,m.life/12,(m.max-m.life)/28);if(fade<=0){meteors.splice(i,1);continue}let tx=m.x-m.dx*m.length,ty=m.y-m.dy*m.length,g=ctx.createLinearGradient(tx,ty,m.x,m.y);g.addColorStop(0,`rgba(${m.color},0)`);g.addColorStop(.7,`rgba(${m.color},${.35*fade})`);g.addColorStop(1,`rgba(255,255,255,${.95*fade})`);ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(m.x,m.y);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();ctx.beginPath();ctx.fillStyle=`rgba(${m.color},${.85*fade})`;ctx.shadowColor=`rgb(${m.color})`;ctx.shadowBlur=18;ctx.arc(m.x,m.y,2.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;}requestAnimationFrame(draw)}requestAnimationFrame(draw);
document.querySelector('#wish-form').addEventListener('submit',e=>{e.preventDefault();const wish=cleanWish(input.value);if(!wish){notice.textContent='先写下你的愿望吧 ✧';input.focus();return}clearTimeout(hideTimer);clearTimeout(showTimer);clearTimeout(flightTimer);display.classList.remove('show','gather');showTimer=setTimeout(()=>{display.textContent=wish;display.classList.add('show')},100);notice.textContent='愿望已乘着流星出发';input.value='';if(!reduce)meteor(true);hideTimer=setTimeout(()=>{display.classList.remove('show');display.classList.add('gather');if(!reduce){const rect=display.getBoundingClientRect();flightTimer=setTimeout(()=>meteor(false,{x:rect.left+rect.width/2,y:rect.top+rect.height/2}),750)}},7500)});
})();
</script></body></html>
